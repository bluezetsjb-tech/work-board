<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<meta name="robots" content="noindex, nofollow">
<title>근무배치표</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 폰 한 손 조작: 상단 표 선택 → 주간/야간 → 조 선택, 아래로 시간표 */
:root{
  --bg:#f4f5f7;--card:#ffffff;--fg:#1b2230;--sub:#5d6675;--line:#e1e4ea;--accent:#1f4e79;
  --cctv:#dbe7f5;--cctv-t:#1f4e79;--lobby:#ece4d4;--lobby-t:#5a4526;--rest:#e2ece3;--rest-t:#2d5e3c;
  --fl:#e6e0f2;--fl-t:#4a3a78;--pat:#f5d547;--pat-t:#3d3200;--park:#86b865;--park-t:#1c3510;
  --now:#e0522f;
  --font:'Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a23;--card:#1d2532;--fg:#eef1f5;--sub:#9aa5b5;--line:#2c3646;--accent:#8fb8e8;
  --cctv:#24384f;--cctv-t:#bcd6f3;--lobby:#3b3326;--lobby-t:#e8d7b6;--rest:#243a2b;--rest-t:#bfe0c8;
  --fl:#332b48;--fl-t:#d6cbf2;--pat:#d9b92e;--pat-t:#2a2200;--park:#5f8f45;--park-t:#0f1f07;--now:#ff7a57;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a23;--card:#1d2532;--fg:#eef1f5;--sub:#9aa5b5;--line:#2c3646;--accent:#8fb8e8;
  --cctv:#24384f;--cctv-t:#bcd6f3;--lobby:#3b3326;--lobby-t:#e8d7b6;--rest:#243a2b;--rest-t:#bfe0c8;
  --fl:#332b48;--fl-t:#d6cbf2;--pat:#d9b92e;--pat-t:#2a2200;--park:#5f8f45;--park-t:#0f1f07;--now:#ff7a57;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);margin:0;padding:12px 16px 32px;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:22px;font-weight:800;margin:4px 0 0}
.meta{font-size:13px;color:var(--sub);margin:0}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--sub);font:600 14px var(--font);padding:10px 2px;white-space:nowrap;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);display:flex;flex-direction:column;gap:8px;padding-block:6px}
.grid{display:flex;flex-direction:column;gap:4px}
.row{display:grid;gap:4px;align-items:stretch}
.t{font-size:13px;font-weight:700;color:var(--sub);display:flex;align-items:center;padding-left:2px}
.c{border-radius:8px;padding:9px 4px;text-align:center;font-size:14px;font-weight:700;line-height:1.25;word-break:keep-all}
.hd .c{background:transparent;color:var(--fg);font-size:14px;font-weight:800;padding:4px}
.row.now .t{color:var(--now)}
.row.now .c{box-shadow:0 0 0 2px var(--now) inset}
.big .c{text-align:left;padding:14px 16px;font-size:17px;display:flex;justify-content:space-between;gap:8px}
.big .c span{font-size:14px;font-weight:600;opacity:.8}
.k-cctv{background:var(--cctv);color:var(--cctv-t)}.k-lobby{background:var(--lobby);color:var(--lobby-t)}
.k-rest{background:var(--rest);color:var(--rest-t)}.k-fl{background:var(--fl);color:var(--fl-t)}
.k-pat{background:var(--pat);color:var(--pat-t)}.k-park{background:var(--park);color:var(--park-t)}
.k-none{background:transparent;color:var(--sub);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend i{font-style:normal;font-size:12px;font-weight:700;padding:4px 8px;border-radius:6px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.box h2{font-size:15px;margin:0}
.pr{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;font-size:14px}
.pr b{font-weight:800}
.pr em{font-style:normal;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px}
.note{font-size:13px;color:var(--sub);margin:0}
@media (prefers-reduced-motion:no-preference){.seg button{transition:background .15s}}
</style>
</head>
<body>

<div class="wrap">
  <div>
    <h1>근무배치표</h1>
    <p class="meta">적용 2026.8.13 ~ · <span id="clock"></span></p>
  </div>
  <div class="seg" id="sched" role="group" aria-label="근무표"></div>
  <div class="sticky">
    <div class="seg" id="shift" role="group" aria-label="주간/야간"></div>
    <div class="seg" id="team" role="group" aria-label="근무"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="legend">
    <i class="k-cctv">CCTV</i><i class="k-lobby">로비</i><i class="k-fl">2/3층</i><i class="k-rest">휴게</i><i class="k-pat">코파스 순찰</i><i class="k-park">주차장 순찰</i>
  </div>
  <div class="box" id="patrol"></div>
</div>

<script>
/* 표기: *=코파스 순찰(노랑), #=주차장 순찰(녹색), -=없음 */
const S={
 we2:{name:"주말 2인",teams:["A","B"],
  day:["로비|CCTV","로비|CCTV","CCTV|*순찰","휴게|CCTV","CCTV|휴게","휴게|CCTV","CCTV|휴게","*순찰|CCTV","CCTV|로비","CCTV|로비"],
  night:["CCTV|로비/식사","로비/식사|CCTV","CCTV|로비","CCTV|로비","로비|CCTV","*순찰|CCTV","CCTV|휴게","CCTV|휴게","CCTV|휴게","휴게|CCTV","휴게|CCTV","휴게|CCTV","CCTV|#개방/순찰","CCTV|로비"],
  patrol:[["10:00","전층 코파스","주간 B","pat"],["15:00","전층 코파스","주간 A","pat"],["23:00","전층 코파스","야간 A","pat"],["06:00","B2F~B4F 주차장","야간 B","park"]],
  notes:["10·15시: 층별 잔류인원 파악 후 순찰일지 기록","06시: 잔류차량 순찰일지 기록","출입문 06:00 개방 (평일 시작 하루 전 공휴일/주말 야간조)"]},
 we3:{name:"주말 3인",teams:["A","B","C"],
  day:["로비|CCTV|2/3층","2/3층|로비|CCTV","CCTV|*순찰|휴게","휴게|CCTV|로비","로비|휴게|CCTV","CCTV|로비|휴게","휴게|CCTV|로비","*순찰|휴게|CCTV","CCTV|2/3층|로비","로비|CCTV|2/3층"],
  night:["CCTV|2/3층/식사|로비","2/3층/식사|로비|CCTV","로비|CCTV|2/3층/식사","CCTV|로비|*순찰","로비|CCTV|휴게","로비|CCTV|휴게","#순찰|CCTV|휴게","CCTV|휴게|로비","CCTV|휴게|로비","CCTV|휴게|로비","휴게|로비|CCTV","휴게|로비|CCTV","휴게|CCTV|#개방/순찰","로비|2/3층|CCTV"],
  patrol:[["10:00","전층 코파스","주간 B","pat"],["15:00","전층 코파스","주간 A","pat"],["21:00","전층 코파스","야간 C","pat"],["00:00","B2F~B4F 주차장","야간 A","park"],["06:00","B2F~B4F 주차장","야간 C","park"]],
  notes:["10·15·21시: 층별 잔류인원 남/북 구분 확인 후 순찰일지 기록","00시: 잔류차량 및 지하2층 차량 번호 기록","06시: 잔류차량 순찰일지 기록","출입문 06:00 개방 (평일 시작 하루 전 공휴일/주말 야간조)"]},
 wd2:{name:"주중 2인",teams:["A","B","백업"],
  day:["로비|CCTV|-","CCTV|로비|-","휴게|CCTV|로비","CCTV|로비|-","로비|휴게|CCTV","CCTV|로비|-","휴게|CCTV|로비","로비|휴게|CCTV","CCTV|로비|-","로비|CCTV|-"],
  night:["CCTV|로비/식사|-","로비|CCTV|-","로비/식사|CCTV|-","CCTV|로비|-","CCTV|#폐쇄/순찰|출입문 폐쇄","*순찰|CCTV|-","CCTV|휴게|-","CCTV|휴게|-","CCTV|휴게|-","휴게|CCTV|-","휴게|CCTV|-","휴게|CCTV|-","CCTV|*개방/순찰|출입문 개방","CCTV|로비|-"],
  patrol:[["22:00","B2F~B4F 주차장","야간 B","park"],["23:00","전층 코파스","야간 A","pat"],["06:00","전층 코파스","야간 B","pat"]],
  notes:["22시: 잔류차량 및 지하2층 차량 번호 기록","주간 백업: 휴게시간 근무 지원 (파트장·팀장)","출입문 22:00 폐쇄 / 06:00 개방"]},
 wd3:{name:"주중 3인",teams:["A","B","C"],
  day:["로비|CCTV|2/3층","2/3층|로비|CCTV","CCTV|휴게|*순찰","휴게|로비|CCTV","로비|CCTV|휴게","CCTV|휴게|로비","휴게|로비|CCTV","*순찰|CCTV|휴게","CCTV|2/3층|로비","2/3층|로비|CCTV"],
  night:["CCTV|2/3층/식사|로비","2/3층/식사|로비|CCTV","로비|CCTV|2/3층/식사","CCTV|로비|*순찰/폐쇄","CCTV|로비|휴게","*순찰|CCTV|휴게","CCTV|#순찰|휴게","로비|휴게|CCTV","로비|휴게|CCTV","로비|휴게|CCTV","휴게|CCTV|로비","휴게|CCTV|로비","휴게|CCTV|*개방/순찰","CCTV|로비|2/3층"],
  patrol:[["10:00","전층 코파스","주간 C","pat"],["15:00","전층 코파스","주간 A","pat"],["21:00","전층 코파스","야간 C","pat"],["23:00","전층 코파스","야간 A","pat"],["00:00","B2F~B4F 주차장","야간 B","park"],["06:00","전층 코파스","야간 C","pat"]],
  notes:["00시: 잔류차량 및 지하2층 차량 번호 기록","출입문 22:00 폐쇄 / 06:00 개방"]}
};
const p2=n=>String(n).padStart(2,"0");
function kind(t){
  if(t[0]==="*")return"pat"; if(t[0]==="#")return"park"; if(t==="-")return"none";
  if(t.includes("출입문"))return"park";
  if(t.includes("CCTV"))return"cctv"; if(t.includes("로비"))return"lobby";
  if(t.includes("휴게"))return"rest"; if(t.includes("2/3층"))return"fl"; return"none";
}
const label=t=>t==="-"?"":t.replace(/^[*#]/,"");
function load(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}

const now=new Date(), H=now.getHours(), dow=now.getDay();
let st={
  sched:load("sched",(dow===0||dow===6)?"we3":"wd3"),
  shift:(H>=8&&H<18)?"day":"night",
  team:load("team","all")
};
if(!S[st.sched])st.sched="wd3";
document.getElementById("clock").textContent=`${now.getMonth()+1}월 ${now.getDate()}일 ${p2(H)}:${p2(now.getMinutes())} 기준`;

function seg(id,items,key){
  const el=document.getElementById(id);el.innerHTML="";
  items.forEach(([v,txt])=>{const b=document.createElement("button");b.type="button";b.textContent=txt;
    b.setAttribute("aria-pressed",st[key]===v);b.onclick=()=>{st[key]=v;if(key!=="shift")save(key,v);render()};el.appendChild(b)});
}
function hours(shift){return shift==="day"?[...Array(10)].map((_,i)=>8+i):[...Array(14)].map((_,i)=>(18+i)%24)}

function render(){
  const d=S[st.sched];
  const ti=d.teams.indexOf(st.team);
  if(st.team!=="all"&&ti<0)st.team="all";
  seg("sched",Object.entries(S).map(([k,v])=>[k,v.name]),"sched");
  seg("shift",[["day","주간 08–18"],["night","야간 18–08"]],"shift");
  seg("team",[["all","전체"],...d.teams.map(t=>[t,t==="백업"?"백업":t+"근무"])],"team");
  const g=document.getElementById("grid");g.innerHTML="";
  const hs=hours(st.shift), rows=d[st.shift].map(r=>r.split("|"));
  if(st.team==="all"){
    const cols=`48px repeat(${d.teams.length},minmax(0,1fr))`;
    const hd=document.createElement("div");hd.className="row hd";hd.style.gridTemplateColumns=cols;
    hd.innerHTML=`<div class="t"></div>`+d.teams.map(t=>`<div class="c">${t==="백업"?"백업":t+"근무"}</div>`).join("");g.appendChild(hd);
    rows.forEach((r,i)=>{const e=document.createElement("div");e.className="row"+(hs[i]===H?" now":"");e.style.gridTemplateColumns=cols;
      e.innerHTML=`<div class="t">${p2(hs[i])}</div>`+r.map(c=>`<div class="c k-${kind(c)}">${label(c)}</div>`).join("");g.appendChild(e)});
  }else{
    const ix=d.teams.indexOf(st.team);const blocks=[];
    rows.forEach((r,i)=>{const c=r[ix],last=blocks[blocks.length-1];
      if(last&&last.c===c)last.end=i;else blocks.push({c,start:i,end:i})});
    blocks.forEach(b=>{const s=hs[b.start],e=(hs[b.end]+1)%24;const on=hs.slice(b.start,b.end+1).includes(H);
      const el=document.createElement("div");el.className="row big"+(on?" now":"");el.style.gridTemplateColumns="1fr";
      el.innerHTML=`<div class="c k-${kind(b.c)}">${label(b.c)||"없음"}<span>${p2(s)}:00–${p2(e)}:00</span></div>`;g.appendChild(el)});
  }
  const p=document.getElementById("patrol");
  p.innerHTML=`<h2>${d.name} 순찰</h2>`+d.patrol.map(([t,w,who,k])=>`<div class="pr"><b>${t}</b><span>${w}</span><em class="k-${k}">${who}근무</em></div>`).join("")+d.notes.map(n=>`<p class="note">${n}</p>`).join("");
}
render();
</script>
</body>
</html>
